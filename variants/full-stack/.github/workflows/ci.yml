name: full-stack CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ownerpw
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Owner (migrations + role login + test rows). PG16 ships gen_random_uuid built in.
      DIRECT_URL: postgresql://postgres:ownerpw@localhost:5432/postgres
      # The app and the suite log in as the NON-OWNER role, so RLS actually applies.
      DATABASE_URL: postgresql://app_runtime:runtimepw@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Apply migrations as owner
        run: npm run db:deploy
      - name: Give the runtime role its login
        run: |
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 \
            -c "SET goodvibes.runtime_password = 'runtimepw';" \
            -f prisma/sql/runtime-role.sql
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
